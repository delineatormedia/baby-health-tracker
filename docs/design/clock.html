<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home dial: bursts and sessions (#51, #52)</title>
<style>
body{margin:0;padding:20px;font:15px ui-monospace,Menlo,monospace;background:#888}
.light{--feed:#6E2A9C;--bottle:#08664C;--wet:#1F6FD6;--dirty:#7F7410;--pump:#C2367A;--bg:#ECEFF1;--panel:#FFFFFF;--ink:#1F2A33;--dim:#5B6670;--line:#D9DEE2}
.night{--feed:#B880D8;--bottle:#25876B;--wet:#4C8EF0;--dirty:#ABA53A;--pump:#DA7AA0;--bg:#0D0C0B;--panel:#161513;--ink:#ADA59A;--dim:#8A8378;--line:#252320}
.row{display:flex;gap:14px;padding:16px;background:var(--bg);color:var(--ink);margin-bottom:14px;border-radius:12px}
.case{width:300px}
.case svg{width:300px;height:300px;display:block}
.case h3{font-size:15px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.case p{margin:0;color:var(--dim);line-height:1.35}
</style>
</head>
<body>
<!-- A mockup, not app code. All times are fake. Geometry is the note's: pump 146, feed 134,
     numerals and counts 115, wet/dirty 99, now line 141 to 150. "Now" is 3:00 AM. -->
<div id="out"></div>
<script>
const NOW = 3;
const pt = (h, r, c = 150) => { const a = (h / 24) * 2 * Math.PI - Math.PI / 2; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
// Arc from h0 to h1 (hours, h1 may pass 24), at radius r.
function arcPath(h0, h1, r) {
  if (h1 < h0) h1 += 24;
  const [x0, y0] = pt(h0, r), [x1, y1] = pt(h1, r);
  return `M${x0} ${y0} A${r} ${r} 0 ${h1 - h0 > 12 ? 1 : 0} 1 ${x1} ${y1}`;
}
const minArc = (r, w) => (w / (2 * Math.PI * r)) * 24;
// A session arc: casing in the dial background, then the colour. parts = [[h0,h1],...] split by side switches.
function session(parts, r, w, colour, cut) {
  const h0 = parts[0][0], h1 = parts[parts.length - 1][1];
  let s = `<path d="${arcPath(h0, Math.max(h1, h0 + minArc(r, w)), r)}" stroke="var(--bg)" stroke-width="${w + 4}" fill="none" stroke-linecap="${cut ? 'butt' : 'round'}"/>`;
  parts.forEach(([a, b], i) => {
    const gap = minArc(r, 2) / 2;
    const a2 = i > 0 ? a + gap : a, b2 = i < parts.length - 1 ? b - gap : Math.max(b, a + minArc(r, w));
    const cap = cut && i === 0 ? 'butt' : 'round';
    s += `<path d="${arcPath(a2, b2, r)}" stroke="${colour}" stroke-width="${w}" fill="none" stroke-linecap="${parts.length > 1 ? 'butt' : cap}"/>`;
  });
  // A cut arc keeps its round end; only the edge at the now line is flat.
  if (cut) { const [x, y] = pt(h1, r); s += `<circle cx="${x}" cy="${y}" r="${w / 2}" fill="${colour}"/>`; }
  return s;
}
const wet = (h) => { const [x, y] = pt(h, 99); return `<circle cx="${x}" cy="${y}" r="5.5" fill="var(--wet)"/>`; };
const dirty = (h) => { const [x, y] = pt(h, 99); return `<rect x="${x - 5.5}" y="${y - 5.5}" width="11" height="11" rx="1" fill="var(--dirty)"/>`; };
const bottle = (h) => { const [x, y] = pt(h, 134); return `<circle cx="${x}" cy="${y}" r="6" fill="var(--panel)" stroke="var(--bottle)" stroke-width="3"/>`; };
const diamond = (h) => { const [x, y] = pt(h, 146); return `<rect x="${x - 4}" y="${y - 4}" width="8" height="8" fill="var(--pump)" transform="rotate(45 ${x} ${y})"/>`; };
const count = (h, n) => { const [x, y] = pt(h, 115); return `<text x="${x}" y="${y + 6.5}" text-anchor="middle" font-family="ui-monospace,Menlo" font-size="18.5" fill="var(--ink)">×${n}</text>`; };
const STEP = (16 / (2 * Math.PI * 99)) * 24;

function dial({ feeds = [], pumps = [], marks = '', counts = [], hide = [] }) {
  let s = `<circle cx="150" cy="150" r="140" fill="none" stroke="var(--line)" stroke-width="1.5"/>`
    + `<circle cx="150" cy="150" r="99" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 5"/>`;
  [0, 6, 12, 18].forEach((h) => {
    const [a, b] = pt(h, 140), [x, y] = pt(h, 131), [tx, ty] = pt(h, 115);
    s += `<line x1="${a}" y1="${b}" x2="${x}" y2="${y}" stroke="var(--dim)" stroke-width="1.5"/>`;
    if (!hide.includes(h)) s += `<text x="${tx}" y="${ty + 6}" text-anchor="middle" font-family="ui-monospace,Menlo" font-size="18.5" fill="var(--dim)">${h}</text>`;
  });
  const [n0, n1] = pt(NOW, 141), [n2, n3] = pt(NOW, 150);
  s += `<line x1="${n0}" y1="${n1}" x2="${n2}" y2="${n3}" stroke="var(--dim)" stroke-width="2"/>`;
  // Longest first, so a shorter session on top shows both ends.
  const len = (p) => { let d = p.parts[p.parts.length - 1][1] - p.parts[0][0]; return d < 0 ? d + 24 : d; };
  [...feeds].sort((a, b) => len(b) - len(a)).forEach((f) => (s += session(f.parts, 134, 10, 'var(--feed)', f.cut)));
  [...pumps].sort((a, b) => len(b) - len(a)).forEach((p) => (s += session(p.parts, 146, 5, 'var(--pump)', p.cut)));
  s += marks;
  counts.forEach(([h, n]) => (s += count(h, n)));
  return `<svg viewBox="0 0 300 300">${s}</svg>`;
}

const m = (h, mm) => h + mm / 60;
const CASES = [
  {
    title: 'Bursts (#51)',
    text: 'Wet tapped 3 times at 1:12 AM: one dot, "×3". A mixed diaper at 9:40 PM: wet and dirty side by side around 9:40. Two wets 15 min apart at 6:05 / 6:20 PM stay at their times. Legend: Wet 6, Dirty 1.',
    svg: dial({
      marks: wet(m(1, 12)) + wet(m(21, 40) - STEP / 2) + dirty(m(21, 40) + STEP / 2) + wet(m(18, 5)) + wet(m(18, 20)),
      counts: [[m(1, 12), 3]],
    }),
  },
  {
    title: 'Sessions (#52)',
    text: 'Breastfeed 10:30 to 11:05 PM, left 20 min then right 15: one arc, a gap at the switch. A both-sides pump 11:15 to 11:35 PM outside. Bottle at 6:40 PM. A pump logged without a timer at 2:00 PM is a diamond.',
    svg: dial({
      feeds: [{ parts: [[m(22, 30), m(22, 50)], [m(22, 50), m(23, 5)]] }, { parts: [[m(17, 50), m(18, 10)]] }],
      pumps: [{ parts: [[m(23, 15), m(23, 35)]] }],
      marks: bottle(m(18, 40)) + diamond(14) + wet(m(23, 10)) + dirty(m(17, 45)),
    }),
  },
  {
    title: 'Running',
    text: 'Feed started 2:31 AM, still going: the arc grows to the now line (3:00 AM). A pump running since 2:40 AM grows on its own ring. A 1-minute feed at 8:00 PM is never shorter than its width.',
    svg: dial({
      feeds: [{ parts: [[m(2, 31), NOW]] }, { parts: [[20, m(20, 1)]] }],
      pumps: [{ parts: [[m(2, 40), NOW]] }],
      marks: wet(m(0, 50)),
    }),
  },
  {
    title: 'Overlap and the 24 h edge',
    text: 'A backdated 4:00 to 5:00 PM feed over a 4:20 to 4:35 PM one: shorter on top, both visible. A feed 2:50 to 3:20 AM yesterday is cut at the now line with a flat end. Two dirty taps at 6:01 AM: one square, "×2"; the 6 numeral yields.',
    svg: dial({
      feeds: [{ parts: [[16, 17]] }, { parts: [[m(16, 20), m(16, 35)]] }, { parts: [[NOW, m(3, 20)]], cut: true }],
      marks: dirty(m(6, 1)) + wet(m(10, 30)),
      counts: [[m(6, 1), 2]],
      hide: [6],
    }),
  },
];
document.getElementById('out').innerHTML = ['light', 'night']
  .map((t) => `<div class="row ${t}">${CASES.map((c) => `<div class="case">${c.svg}<h3>${c.title} · ${t}</h3><p>${c.text}</p></div>`).join('')}</div>`)
  .join('');
</script>
</body>
</html>
