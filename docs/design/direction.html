<!doctype html>
<html><head><meta charset="utf-8"><title>Baby Health Tracker · Instrument direction</title>
<!-- Static mockup. Fake data only. Open with ?board=core or ?board=rest. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D3D8DC;font-family:-apple-system,system-ui,sans-serif;padding:48px 56px 56px;color:#1F2A33}
.board-h{font:600 28px/1.1 -apple-system,system-ui,sans-serif}
.board-s{font:400 15px/1.45 -apple-system,system-ui,sans-serif;color:#4F5B64;margin:6px 0 18px;max-width:1700px}
.palette{display:flex;gap:28px;margin:0 0 26px;font:500 11px ui-monospace,Menlo,monospace;color:#4F5B64;letter-spacing:.06em;text-transform:uppercase}
.palette div{display:flex;align-items:center;gap:6px}
.palette i{width:22px;height:22px;border-radius:6px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.row{display:flex;gap:26px;margin-bottom:18px}
.cap{font:500 12px/1 ui-monospace,Menlo,monospace;color:#4F5B64;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px 4px;white-space:nowrap}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #111,0 20px 50px rgba(0,0,0,.25);margin:10px;background:var(--bg);color:var(--ink)}

/* Tokens. Light is unchanged from C. Night is "graphite": warm near-black, dim stone ink, muted sage accent. No red. */
.light{--feed:#6E2A9C;--bottle:#08664C;--wet:#1F6FD6;--dirty:#7F7410;--pump:#C2367A;--bg:#ECEFF1;--panel:#FFFFFF;--ink:#1F2A33;--dim:#5B6670;--line:#D9DEE2;--acc:#2E6A8E;--accInk:#FFFFFF;--band:#D6E4EC;--flag:#A0502B;--flagSoft:#F7EBE3;--well:#FFFFFF}
.night{--feed:#B880D8;--bottle:#25876B;--wet:#4C8EF0;--dirty:#ABA53A;--pump:#DA7AA0;--bg:#0D0C0B;--panel:#161513;--ink:#ADA59A;--dim:#8A8378;--line:#252320;--acc:#6F8F84;--accInk:#0D0C0B;--band:#1E2925;--flag:#C29A62;--flagSoft:#1B1712;--well:#1C1A17}

.sb{height:50px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font:600 15px -apple-system,system-ui,sans-serif}
.lab{font:500 15px ui-monospace,Menlo,monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:16px 24px 0}
.top b{font:600 17px -apple-system,system-ui,sans-serif}
.top .act{font:500 20px -apple-system,system-ui,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* home */
.dial{position:relative;width:300px;height:300px;margin:26px auto 0}
.dial svg{position:absolute;inset:0}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.center .v{font:300 60px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:8px 0}
.legend{display:flex;justify-content:center;gap:18px;margin-top:14px;font:400 15px -apple-system,system-ui,sans-serif;color:var(--dim)}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:12px;height:12px;display:inline-block}
.quiet{text-align:center;margin-top:18px;font-size:17px;color:var(--dim)}
.quiet b{color:var(--ink);font-weight:500}
.chips{position:absolute;left:12px;right:12px;bottom:236px;display:flex;gap:6px}
.chips div{flex:1;height:52px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:500 20px -apple-system,system-ui,sans-serif;color:var(--ink)}
.rail{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 30px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:88px 88px;gap:8px;background:var(--bg)}
.rail>div{--ev:var(--line);border-radius:16px;background:var(--panel);border:2px solid var(--ev);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;font:600 20px/1.1 -apple-system,system-ui,sans-serif}
.rail .tall{grid-row:span 2}
.rail b{display:flex;align-items:center;gap:8px;font-weight:600}
.rail small{white-space:nowrap;font:400 15px/1.25 -apple-system,system-ui,sans-serif;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.rail small em{font-style:normal;color:var(--ink)}
.rail .run{border-width:3px;background:color-mix(in srgb,var(--ev) 16%,var(--panel))}
.rail .run small{color:var(--ink)}
.rail .run .clock{font:300 34px/1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.g{display:inline-block;width:12px;height:12px;flex:none}
.g.g-feed{background:var(--feed);border-radius:2px;width:6px;height:14px}
.g.g-bottle{border:2.5px solid var(--bottle);border-radius:50%}
.g.g-wet{background:var(--wet);border-radius:50%}
.g.g-dirty{background:var(--dirty)}
.g.g-pump{background:var(--pump);transform:rotate(45deg) scale(.85)}
.toast{position:absolute;left:16px;right:16px;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:52px;display:flex;justify-content:space-between;align-items:center;font-size:17px;background:var(--panel)}
.toast b{font:600 20px -apple-system,system-ui,sans-serif}
.toast .acts{display:flex;gap:18px}

/* shared controls */
.seg{display:flex;margin:18px 16px 0;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.seg div{flex:1;height:54px;display:flex;align-items:center;justify-content:center;font:600 20px -apple-system,system-ui,sans-serif}
.seg div+div{border-left:1px solid var(--line)}
.seg .on{background:var(--ink);color:var(--bg)}
.go{position:absolute;left:16px;right:16px;bottom:30px;height:66px;border-radius:18px;background:var(--acc);color:var(--accInk);display:flex;align-items:center;justify-content:center;font:600 20px -apple-system,system-ui,sans-serif}
.go2{position:absolute;left:16px;right:16px;bottom:106px;height:54px;border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:500 20px -apple-system,system-ui,sans-serif}
.sec{margin:26px 24px 10px}
.opts{display:grid;gap:8px;margin:0 16px}
.opts div{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:20px}
.opts .on{border:2px solid var(--ink);font-weight:600}
.steps{display:flex;gap:6px;margin:14px 24px 0}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}

/* diaper */
.well{margin:14px 16px 0;border-radius:18px;padding:14px;background:var(--well);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* Swatch labels are solid black or white, whichever passes 4.5:1 on that swatch. Never an opacity. */
.tile{height:84px;border-radius:12px;position:relative;padding:8px 10px;font:500 20px/1.1 -apple-system,system-ui,sans-serif;display:flex;align-items:flex-end;color:#000}
.tile.dk{color:#FFF}
.tile.sm{height:60px}
.tile.fl::after{content:"!";position:absolute;top:6px;right:9px;font:700 20px ui-monospace,Menlo,monospace}
.flagnote{margin:16px 2px 8px;color:var(--flag)}
.toggle{display:flex;justify-content:space-between;align-items:center;margin:16px 16px 0;padding:0 16px;height:56px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:20px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.sw.on{background:var(--acc)}.sw.on::after{left:23px;background:var(--accInk)}
.hint{position:absolute;left:0;right:0;bottom:40px;text-align:center}
.done{display:flex;align-items:center;gap:12px;margin:18px 16px 0;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.done .chip{width:34px;height:34px;border-radius:8px}
.done div{flex:1;font-size:17px}
.done.tap div{font-size:20px}
.done small{display:block;color:var(--dim);font-size:15px;margin-top:2px}

/* bottle + pump */
.bottle{position:relative;margin:22px 16px 0;display:grid;grid-template-columns:1fr 130px 1fr;gap:12px}
.scale{position:relative}
.scale div{position:absolute;font:500 15px ui-monospace,Menlo,monospace;color:var(--dim);transform:translateY(-50%)}
.scale.l div{right:0}.scale.r div{left:0}
.scale .hi{color:var(--ink);font-weight:700;font-size:17px}
.vessel{position:relative;border:2px solid var(--ink);border-radius:26px 26px 30px 30px;overflow:hidden;background:var(--panel)}
.fill{position:absolute;left:0;right:0;bottom:0;background:var(--band)}
.fill::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc)}
.grip{position:absolute;left:50%;width:62px;height:22px;margin-left:-31px;border-radius:11px;background:var(--acc);transform:translateY(-50%)}
.readout{text-align:center;margin-top:16px}
.readout .v{font:300 44px -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.readout .v span{color:var(--dim);font-size:22px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:22px 40px 0}
.pair .vessel{height:300px}
.pair .cap2{text-align:center;margin-top:10px}
.pair .cap2 b{display:block;font:300 30px -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;margin-top:2px}

/* feed */
.big{text-align:center;margin-top:70px}
.big .v{font:200 96px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:12px 0}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:56px 16px 0}
.sides div{height:120px;border-radius:18px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 20px -apple-system,system-ui,sans-serif}
.sides .on{border:2px solid var(--acc)}
.sides small{font:400 15px ui-monospace,Menlo,monospace;color:var(--dim)}

/* readings */
.verdict{margin:18px 16px 0;border-radius:18px;padding:18px;background:var(--panel);border:1px solid var(--line)}
.verdict h3{font:600 20px/1.25 -apple-system,system-ui,sans-serif;margin:8px 0 4px}
.verdict p{font-size:17px;color:var(--dim)}
.verdict.flag{background:var(--flagSoft);border:1.5px solid var(--flag)}
.verdict.flag .lab{color:var(--flag)}
.verdict .more{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:20px;font-weight:600}
.verdict.flag .more{border-top-color:color-mix(in srgb,var(--flag) 35%,transparent)}
.gauge{margin:10px 16px 0;padding:16px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.gauge .r{display:flex;justify-content:space-between;align-items:baseline}
.gauge .k{font:600 17px -apple-system,system-ui,sans-serif}
.gauge .v{font:500 17px ui-monospace,Menlo,monospace}
.track{position:relative;height:26px;margin-top:12px}
.track .base{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.track .band{position:absolute;top:6px;height:14px;background:var(--band);border-radius:3px}
.track .pt{position:absolute;top:3px;width:4px;height:20px;background:var(--ink);border-radius:2px;margin-left:-2px}

/* why */
.prose{margin:22px 24px 0;font-size:17px;line-height:1.5}
.prose h2{font:600 24px/1.2 -apple-system,system-ui,sans-serif;margin:8px 0 12px}
.prose p{margin-bottom:12px}
.src{margin:16px 16px 0;padding:14px 16px;border-radius:14px;border:1px dashed var(--line);font-size:15px;line-height:1.45;color:var(--dim)}

/* history + settings + forms */
.day{margin:20px 24px 6px}
.ev{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:10px;padding:13px 24px;border-bottom:1px solid var(--line)}
.ev .t{font:500 15px ui-monospace,Menlo,monospace;color:var(--dim)}
.ev .k{font-size:20px}
.ev .k small{display:block;color:var(--dim);font-size:15px;margin-top:2px}
.ev .who{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:500 15px ui-monospace,Menlo,monospace;color:var(--dim)}
.ev .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.list{margin:0 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.list div{display:flex;justify-content:space-between;align-items:center;padding:0 16px;height:56px;font-size:20px}
.list div+div{border-top:1px solid var(--line)}
.list span{color:var(--dim);font-size:15px}
.field{margin:0 16px 0;padding:10px 16px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.field b{display:block;font:400 20px -apple-system,system-ui,sans-serif;margin-top:4px}
.field+.field{margin-top:8px}
.keys{position:absolute;left:12px;right:12px;bottom:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys div{height:58px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:400 24px -apple-system,system-ui,sans-serif}
.keys .ghost{background:none;border:none;color:var(--dim);font-size:20px}
.mark{display:flex;justify-content:center;margin-top:150px}
/* reports (#21) */
.rp-step{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin:14px 16px 0}
.rp-step .arr{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font:500 24px -apple-system,system-ui,sans-serif}
.rp-step .arr.off{background:none;color:var(--dim)}
.rp-step .d{text-align:center}
.rp-step .d b{display:block;font:600 20px -apple-system,system-ui,sans-serif}
.rp-step .d .lab{display:block;margin-top:4px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 16px 0}
.sum>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px}
.sum .n{font:300 36px/1.1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;margin:4px 0 4px}
.sum .n small{font-size:17px;color:var(--dim)}
.sub{font:400 15px/1.35 -apple-system,system-ui,sans-serif;color:var(--dim);font-variant-numeric:tabular-nums}
.sub b{font-weight:500;color:var(--ink)}
.sub .g{margin-right:5px;vertical-align:-1px}
.avg{margin:14px 24px 0;font-size:17px;line-height:1.4}
.avg b{font-weight:600;font-variant-numeric:tabular-nums}
.strip{margin:8px 16px 0;padding:10px 12px 6px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.strip svg{display:block;width:100%}
.rr{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:10px;padding:9px 24px;border-bottom:1px solid var(--line)}
.rr .t{font:500 15px ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap;text-align:right}
.rr .k{font-size:17px}
.rr .k small{color:var(--dim);font-size:15px;margin-left:6px}
.rr .k .g{margin-right:8px}
.after{margin:12px 24px 2px}
.wk{margin:12px 16px 0;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.wk>div{padding:10px 14px 8px}
.wk>div+div{border-top:1px solid var(--line)}
.wk .h{display:flex;justify-content:space-between;align-items:baseline}
.wk .h b{font:600 20px -apple-system,system-ui,sans-serif}
.wk .on{background:color-mix(in srgb,var(--acc) 10%,var(--panel))}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:10px 12px 0}
.cal .wd{text-align:center;font:500 15px ui-monospace,Menlo,monospace;color:var(--dim);padding-bottom:2px}
.cal .c{height:74px;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:5px 5px 4px;display:flex;flex-direction:column;justify-content:space-between}
.cal .c b{font:500 20px/1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.cal .c span{display:flex;align-items:center;gap:4px;font:400 15px/1.15 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.cal .c.x{background:none;border-color:transparent}
.cal .c.x b{font-weight:400;color:var(--dim)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c.wkon{background:color-mix(in srgb,var(--acc) 10%,var(--panel))}
.pairg{display:inline-flex;gap:1px;align-items:center;flex:none}
.pairg i{display:inline-block;width:6px;height:6px}
.note{margin:10px 24px 0;font:400 15px/1.45 -apple-system,system-ui,sans-serif;color:var(--dim)}
.note b{color:var(--ink);font-weight:500}
</style></head><body>
<div id="root"></div>
<script>
const SW={normal:[["Yellow","#E6C24A"],["Mustard","#C9A227"],["Green","#6F7F2E"],["Brown","#7A5230",1],["Black","#2A2420",1]],
          flag:[["Pale yellow","#EFE6B8"],["Clay","#BDB3A1"],["White","#F4F1EA"],["Red","#9E2A22",1]]};
const sb=`<div class="sb"><span class="num">2:59</span><span>●●● ▮</span></div>`;
const hdr=(t,r)=>`<div class="top"><b>${t}</b><span class="lab">${r}</span></div>`;
// Tappable header: the left side goes back, the right side edits the time. Both are controls, so 20 px.
const hdrA=(t,r,back)=>`<div class="top">${back?`<span class="act">${t}</span>`:`<b>${t}</b>`}${r?`<span class="act">${r}</span>`:''}</div>`;

function pt(h,r,c=150){const a=(h/24)*2*Math.PI-Math.PI/2;return[c+r*Math.cos(a),c+r*Math.sin(a)]}
function dialSvg(running){
  const feeds=[23.83,20.5,17.3,14.6,8.7,5.6,0.2], bottles=[11.9,2.05], wets=[2.08,22.6,19.1,15.8,12.4,9.2,6.1], dirty=[23.33,18.1,13.2,7.4];
  if(!running) feeds.unshift(1.67);
  const tick=(h,r1,r2,c,w)=>{const[a,b]=pt(h,r1),[x,y]=pt(h,r2);return`<line x1="${a}" y1="${b}" x2="${x}" y2="${y}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  let s=`<circle cx="150" cy="150" r="140" fill="none" stroke="var(--line)" stroke-width="1.5"/><circle cx="150" cy="150" r="99" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 5"/>`;
  [0,6,12,18].forEach(h=>{s+=tick(h,140,131,'var(--dim)',1.5);const[x,y]=pt(h,121);s+=`<text x="${x}" y="${y+5}" text-anchor="middle" font-family="ui-monospace,Menlo" font-size="15" fill="var(--dim)">${h}</text>`});
  feeds.forEach(h=>s+=tick(h,141,126,'var(--feed)',6));
  bottles.forEach(h=>{const[x,y]=pt(h,134);s+=`<circle cx="${x}" cy="${y}" r="6" fill="var(--panel)" stroke="var(--bottle)" stroke-width="3"/>`});
  if(running){const[a1,b1]=pt(2.85,134),[a2,b2]=pt(2.98,134);s+=`<path d="M${a1} ${b1} A134 134 0 0 1 ${a2} ${b2}" stroke="var(--feed)" stroke-width="14" fill="none" stroke-linecap="round"/>`}
  wets.forEach(h=>{const[x,y]=pt(h,99);s+=`<circle cx="${x}" cy="${y}" r="5.5" fill="var(--wet)"/>`});
  dirty.forEach(h=>{const[x,y]=pt(h,99);s+=`<rect x="${x-5.5}" y="${y-5.5}" width="11" height="11" rx="1" fill="var(--dirty)"/>`});
  return `<svg viewBox="0 0 300 300">${s}</svg>`;
}
const legend=(f)=>`<div class="legend"><span><i class="g g-feed"></i>Feed <b>${f}</b></span><span><i class="g g-bottle"></i>Bottle <b>2</b></span><span><i class="g g-wet"></i>Wet <b>7</b></span><span><i class="g g-dirty"></i>Dirty <b>4</b></span></div>`;
const btn=(ev,label,lines,cls='')=>`<div class="${cls}" style="--ev:var(--${ev})"><b><i class="g g-${ev}"></i>${label}</b>${lines.map(l=>`<small>${l}</small>`).join('')}</div>`;
function rail(running){return `<div class="rail">${running
  ?`<div class="tall run" style="--ev:var(--feed)"><b><i class="g g-feed"></i>Stop</b><span class="clock">08:42</span><small><em>Right</em> side</small></div>`
  :btn('feed','Feed',['<em>1h 19m</em> ago','at 1:40 AM','<em>Left</em> side'],'tall')}
  ${btn('wet','Wet',running?['<em>Just now</em>','at 2:59 AM']:['<em>54m</em> ago','at 2:05 AM'])}${btn('dirty','Dirty',['<em>3h 10m</em> ago','at 11:49 PM'])}

const DS=8, MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const clk=h=>{const c=(h+DS)%24,hh=Math.floor(c),mm=Math.round((c-hh)*60);return`${(hh%12)||12}:${String(mm).padStart(2,'0')} ${hh<12?'AM':'PM'}`};
const at=t=>{const[h,m]=t.split(':').map(Number);return(h-DS+24)%24+m/60}; // 24 h clock in, hours since day start out
// Monday Oct 26, by hand: the day in the issue (1-4 AM feeds count as Monday night).
const MONDAY=[['feed','8:40',14,'Left · 14 min'],['pump','9:30',0,'45 L · 38 R'],['wet','10:05'],['dirty','11:20',0,'Mustard · soft'],['bottle','11:50',60,'Breast milk'],['feed','13:10',18,'Right · 18 min'],['wet','14:00'],['bottle','15:30',60,'Formula'],['feed','16:45',12,'Left · 12 min'],['dirty','17:30',0,'Yellow · seedy'],['feed','19:10',16,'Right · 16 min'],['wet','20:00'],['bottle','22:40',60,'Breast milk'],['wet','23:30'],['feed','1:40',15,'Left · 15 min'],['wet','2:05'],['feed','3:15',20,'Right · 20 min'],['dirty','4:10',0,'Mustard · soft']]
 .map(([ev,t,v,d])=>({ev,h:at(t),v,d}));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dayEvents(d){ // d = day of October 2026
 if(d===26)return MONDAY; if(d<17||d>28)return null;
 const r=rng(d*7919),n=(a,b)=>a+Math.floor(r()*(b-a+1)),end=d===28?19:24,out=[];
 const put=(ev,k,f)=>{for(let i=0;i<k;i++){const h=r()*end;out.push({ev,h,...f()})}};
 put('feed',Math.round(n(5,7)*end/24),()=>({v:n(10,22)}));put('bottle',Math.round(n(2,4)*end/24),()=>({v:[45,60,60,75][n(0,3)]}));
 put('wet',Math.round((d<22?n(3,5):n(5,7))*end/24),()=>({}));put('dirty',Math.round(n(2,4)*end/24),()=>({}));
 if(r()<.6)put('pump',1,()=>({v:n(60,90)}));
 return out.sort((a,b)=>a.h-b.h)}
const tally=E=>{const c={feed:0,bottle:0,wet:0,dirty:0,pump:0,ml:0,pml:0};E.forEach(e=>{c[e.ev]++;if(e.ev==='bottle')c.ml+=e.v;if(e.ev==='pump')c.pml+=e.v||83});return c};
// Timeline in the dial's shapes. Feed bars (length = duration) and bottle rings share the top lane, like the dial's outer ring; wet dots and dirty squares share the next, like its inner ring. Pump gets its own lane.
function strip(E,W,mini){const H=mini?26:62,x=h=>4+h/24*(W-8),y=mini?{feed:7,bottle:7,wet:19,dirty:19,pump:19}:{feed:12,bottle:12,wet:32,dirty:32,pump:52};
 let s=`<line x1="${x(16)}" y1="0" x2="${x(16)}" y2="${H}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="2 3"/>`;
 if(!mini)[0,6,12,18,24].forEach(h=>s+=`<line x1="${x(h)}" y1="0" x2="${x(h)}" y2="${H}" stroke="var(--line)" stroke-width="1"/>`);
 const k=mini?.62:1;
 E.forEach(e=>{const X=x(e.h),Y=y[e.ev];
  if(e.ev==='feed')s+=`<rect x="${X}" y="${Y-7*k}" width="${Math.max(3*k,e.v/60/24*(W-8))}" height="${14*k}" rx="1.5" fill="var(--feed)"/>`;

  if(e.ev==='dirty')s+=`<rect x="${X-5*k}" y="${Y-5*k}" width="${10*k}" height="${10*k}" rx="1" fill="var(--dirty)"/>`;
  if(e.ev==='pump'&&!mini)s+=`<rect x="${X-4.5}" y="${Y-4.5}" width="9" height="9" fill="var(--pump)" transform="rotate(45 ${X} ${Y})"/>`});
