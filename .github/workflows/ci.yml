name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
      - name: flake.lock is committed and current
        run: git diff --exit-code flake.lock
      - name: Smoke-test the Nix outputs
        run: |
          nix build .#bht-server .#bht-web
          PORT=8787 DATABASE_PATH="$RUNNER_TEMP/bht.db" ./result/bin/bht-server &
          sleep 2
          curl -fsS http://127.0.0.1:8787/api/health
          test -f result-1/index.html
          test -f result-1/service-worker.js
