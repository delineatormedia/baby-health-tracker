name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Browser checks (#43): Chromium and WebKit against the production build. Separate from check
  # so a browser download never holds up the fast gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @bht/web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @bht/web exec playwright install --with-deps chromium webkit
      - name: Install system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @bht/web exec playwright install-deps chromium webkit
      - run: pnpm --filter @bht/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM for the NixOS VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check --print-build-logs
      - name: flake.lock is committed and current
        run: git diff --exit-code flake.lock
      - name: Smoke-test the Nix outputs
        run: |
          nix build .#bht-server .#bht-web
          PORT=8787 DATABASE_PATH="$RUNNER_TEMP/bht.db" ./result/bin/bht-server &
          sleep 2
          curl -fsS http://127.0.0.1:8787/api/health
          test -f result-1/index.html
          test -f result-1/service-worker.js
