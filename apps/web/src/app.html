<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ECEFF1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0C0B" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <title>Baby Health Tracker</title>
    <script>
      // Apply the saved theme before first paint so night mode never flashes light.
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem('bht.prefs') || '{}').theme || 'auto';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
